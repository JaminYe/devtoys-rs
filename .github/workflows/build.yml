name: Build & Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # GPUI 在 Linux 上依赖额外系统库
      - name: Install Linux dependencies (GPUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype6-dev libasound2-dev \
            libgl1-mesa-dev libegl1-mesa-dev pkg-config

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows installer (Inno Setup)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version /DTarget=${{ matrix.target }} packaging\windows\setup.iss
          Move-Item "packaging\windows\output\devtoys-${{ matrix.target }}-setup.exe" "devtoys-${{ matrix.target }}-setup.exe"

      - name: Prepare package directory
        shell: bash
        run: |
          mkdir -p package
          BIN_DIR="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; else EXT=""; fi
          cp "$BIN_DIR/devtoys$EXT" package/
          cp "$BIN_DIR/devtoys-cli$EXT" package/
          cp README.md LICENSE package/ 2>/dev/null || true

      - name: Upload artifacts (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: devtoys-${{ matrix.target }}
          path: package/
          retention-days: 7

      - name: Create archives for tag release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd package
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../devtoys-${{ matrix.target }}.zip" .
          else
            tar czf "../devtoys-${{ matrix.target }}.tar.gz" .
          fi
          cd ..
          sha256sum devtoys-${{ matrix.target }}.* >> checksums.txt
          if [ -f "devtoys-${{ matrix.target }}-setup.exe" ]; then
            sha256sum "devtoys-${{ matrix.target }}-setup.exe" >> checksums.txt
          fi

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            devtoys-*.zip
            devtoys-*.tar.gz
            devtoys-*-setup.exe
            checksums.txt
