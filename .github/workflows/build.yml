name: Build & Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-x86_64-pc-windows-msvc

      - name: Resolve and validate build version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref_name }}"
            $ver = $tag -replace '^[vV]', ''
            $semverRegex = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
            if ($ver -notmatch $semverRegex) {
              Write-Error "Release tag '$tag' does not conform to SemVer specification."
              exit 1
            }
            Write-Host "Resolved release SemVer: $ver"
            "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            # Workspace default version for non-tag builds
            $cargoToml = Get-Content "Cargo.toml" -Raw
            if ($cargoToml -match 'version\s*=\s*"([^"]+)"') {
              $ver = $matches[1]
            } else {
              $ver = "0.1.0"
            }
            Write-Host "Non-tag build using workspace version: $ver"
            "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Build release binary
        shell: pwsh
        run: |
          $env:DEVTOYS_APP_VERSION = "$env:APP_VERSION"
          cargo build --release --target x86_64-pc-windows-msvc -p devtoys

      - name: Package Windows installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION /DTarget=x86_64-pc-windows-msvc packaging\windows\setup.iss
          Move-Item "packaging\windows\output\devtoys-x86_64-pc-windows-msvc-setup.exe" "devtoys-x86_64-pc-windows-msvc-setup.exe"

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "devtoys-x86_64-pc-windows-msvc-setup.exe").Hash.ToLower()
          "$hash  devtoys-x86_64-pc-windows-msvc-setup.exe" | Set-Content -Path "checksums.txt" -Encoding ascii
          Write-Host "Generated checksum: $hash  devtoys-x86_64-pc-windows-msvc-setup.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows-x64
          path: |
            devtoys-x86_64-pc-windows-msvc-setup.exe
            checksums.txt
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-windows-x64
          path: dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/devtoys-x86_64-pc-windows-msvc-setup.exe
            dist/checksums.txt
