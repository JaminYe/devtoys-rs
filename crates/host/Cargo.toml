[package]
name = "devtoys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "egui desktop host: window, sidebar, settings. No business algorithms."

[[bin]]
name = "devtoys"
path = "src/main.rs"

[dependencies]
devtoys-api.workspace = true
devtoys-core.workspace = true
devtoys-tools = { workspace = true, features = ["gui"] }
dirs.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
hex.workspace = true
log.workspace = true
memmap2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
skrifa.workspace = true
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Globalization"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
